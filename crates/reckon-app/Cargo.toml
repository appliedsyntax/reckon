[package]
name = "reckon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reckon desktop app (GPUI)"

[[bin]]
name = "reckon-app"
path = "src/main.rs"

[dependencies]
reckon-core = { path = "../reckon-core" }
# `runtime_shaders` compiles Metal shaders at startup, so building does not
# require the separate Xcode Metal toolchain download.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

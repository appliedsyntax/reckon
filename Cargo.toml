[workspace]
resolver = "2"
members = ["crates/reckon-core", "crates/reckon-cli", "crates/reckon-app", "crates/reckon-ffi"]
default-members = ["crates/reckon-core", "crates/reckon-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

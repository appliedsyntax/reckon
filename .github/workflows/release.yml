name: Build packages

# Builds every platform's package on its own OS. Push a tag like v0.1.0 to
# also publish a GitHub release with the files attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Build jobs can only read the repository. Only the release job, which runs
# no build scripts, may write (to create the release). Actions are pinned to
# a commit, since a tag can be moved to different code.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup target add x86_64-apple-darwin
      - run: UNIVERSAL=1 packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: macos, path: dist/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - run: packaging/ios/build.sh simulator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: ios-simulator, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build dependencies
        run: |
          # The runner's default Azure mirror is sometimes unreachable; use
          # Ubuntu's main archive and retry a few times.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          for attempt in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y build-essential pkg-config \
              libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
              libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev \
              libzstd-dev && exit 0
            echo "apt failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          exit 1
      - run: cargo test --locked -p reckon-core
      - name: Hostile input fits on a small stack (release build)
        run: cargo test --locked --release -p reckon-core --test hostile
      - name: Third-party notices are up to date
        run: |
          python3 packaging/third-party-licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.txt MOBILE_LICENSES.txt \
            || { echo "::error::Run packaging/third-party-licenses.py and commit the license files"; exit 1; }
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo test --locked -p reckon-core
      - shell: pwsh
        run: packaging/windows/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" packaging/android/build-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, ios, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
